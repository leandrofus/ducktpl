name: Release

# Runs on a tag like v0.2.0: tag.yml creates it (and starts this workflow)
# when a version bump reaches main; pushing one by hand works too. Builds
# static binaries and attaches them, with checksums, to the GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch: # tag.yml, on the new tag

permissions:
  contents: write
  # duck:if site
  actions: write # to rebuild the site with the new release
  # duck:end

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    # a manual run on a branch must not publish anything
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - uses: oven-sh/setup-bun@v2
      - name: Web UI
        run: cd web && bun install --frozen-lockfile && bun run build
      - name: Tests
        working-directory: gateway
        run: go test ./...
      - name: Static binaries
        run: make dist VERSION=$GITHUB_REF_NAME
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="dist/duckapp-* dist/SHA256SUMS"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files --title "DuckApp ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
          fi
  # duck:if site

  site:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # releases made with GITHUB_TOKEN do not trigger other workflows
        run: gh workflow run pages.yml --ref main
  # duck:end
