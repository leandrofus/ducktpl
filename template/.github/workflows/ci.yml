name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - uses: oven-sh/setup-bun@v2
      # The contract is generated: a handler or DTO changed without
      # `make generate` fails here, as do UI types out of step with it.
      - name: Generated code is current
        run: |
          make -C gateway generate openapi
          cd web && bun install --frozen-lockfile && bun run gen-api
          git diff --exit-code
      # the gateway embeds the UI, so it is built before any Go step
      - name: Typecheck and build the UI
        run: cd web && bun run build
      - name: go vet
        working-directory: gateway
        run: go vet ./...
      - name: Go tests (SQLite)
        working-directory: gateway
        run: go test -race ./...
      - name: Static build
        working-directory: gateway
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/duckapp ./cmd/duckapp
      # duck:if pam
      - name: Build with PAM
        working-directory: gateway
        run: sudo apt-get install -y libpam0g-dev && CGO_ENABLED=1 go build -tags pam -o /tmp/duckapp-pam ./cmd/duckapp
      # duck:end
      # duck:if site
      - name: Site
        run: cd site && bun install && bun run build
      # duck:end

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: duckapp, POSTGRES_PASSWORD: duckapp, POSTGRES_DB: duckapp }
        ports: ['25432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-retries 20
      # duck:if redis
      redis:
        image: redis:7-alpine
        ports: ['26379:6379']
      # duck:end
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - name: Go tests (PostgreSQL)
        working-directory: gateway
        env:
          DUCKAPP_TEST_POSTGRES: postgres://duckapp:duckapp@127.0.0.1:25432/duckapp?sslmode=disable
          # duck:if redis
          DUCKAPP_TEST_REDIS: redis://127.0.0.1:26379/15
          # duck:end
        run: go test -count=1 ./internal/...
