version: "2"
sql:
  # Queries are written to run on both engines (SQLite accepts $N
  # placeholders); types come from the PostgreSQL schema.
  - engine: postgresql
    schema: internal/store/migrations/postgres
    queries: internal/store/queries
    gen:
      go:
        package: db
        out: internal/store/db
        emit_empty_slices: true
        rename:
          actor_ip: ActorIP
          ip: IP
        overrides:
          # ducktpl's json fields are strings in Go (the handler validates them);
          # without this sqlc maps JSONB to json.RawMessage and the code does not compile
          - db_type: jsonb
            go_type: string
