# Static part of the spec. Paths and component schemas are generated by
# `make generate` (cmd/openapi-gen) from `openapi:operation` and
# `openapi:schema` comments in internal/**. Do not edit openapi.yaml by hand.
openapi: 3.1.0
info:
  title: DuckApp API
  version: 0.1.0
  description: >-
    API of DuckApp. Every request that changes state must send the
    X-DuckApp-Request header (any value): together with SameSite=Strict
    cookies it blocks cross-site requests.
servers:
  - url: /api/v1
# duck:if auth
security:
  - session: []
# duck:else
# security: []
# duck:end
tags:
  - { name: system, description: Health and version. }
  # duck:if auth
  - { name: auth, description: Signing in and the caller's own account. }
  - { name: users, description: Accounts and roles (admins). }
  # duck:end
  - { name: notes, description: The example resource. }
  # duck:if audit
  - { name: audit, description: Tamper-evident audit log. }
  # duck:end
components:
  # duck:if auth
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: duckapp_session
  # duck:end
  parameters:
    CSRF:
      name: X-DuckApp-Request
      in: header
      required: true
      schema: { type: string }
      description: Any value. Required on every state-changing request.
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string, description: 'Machine-readable code, e.g. not_found, conflict, csrf.' }
        message: { type: string }
